# Daily refresh of the coverage dashboard, run by GitHub Actions.
# Secrets (repo Settings -> Secrets and variables -> Actions): QUALTRICS_TOKEN, QUALTRICS_DATACENTER (yul1).
# The export names only de-identified fields (no email, no IP, no free text); the raw exports never enter GitHub.
# Inputs committed to the repo: data/ (school table, earlier-wave school counts, state codebook) and the public NCES
# and dropdown CSVs under inputs/. Rebuild data/ locally with build_historical.py + build_schools.py when a new wave arrives.
name: Refresh coverage dashboard
on:
  schedule:
    - cron: "15 13-22 * * 1-5"   # weekdays, hourly at :15 from 13:15 to 22:15 UTC = 9am-6pm EDT / 8am-5pm EST
    - cron: "30 6 * * *"          # once a day at 06:30 UTC (about 2:30am Eastern) to cover nights and weekends
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dashboard/**", "coverage_export.py", "common.py", "config.json", "data/**", "inputs/**"]   # code or data change: republish
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Pull the outreach tracker (published-CSV link kept as a secret; the file is never committed)
        env:
          OUTREACH_CSV_URL: ${{ secrets.OUTREACH_CSV_URL }}
        run: |
          if [ -n "$OUTREACH_CSV_URL" ]; then
            curl -sSL "$OUTREACH_CSV_URL" -o /tmp/outreach_tracker.csv && python3 build_outreach.py /tmp/outreach_tracker.csv || echo "outreach tracker not read this run"
          else
            echo "No OUTREACH_CSV_URL secret: outreach context skipped"
          fi
      - name: Pull Qualtrics (whitelisted fields only) and rebuild
        env:
          QUALTRICS_TOKEN: ${{ secrets.QUALTRICS_TOKEN }}
          QUALTRICS_DATACENTER: ${{ secrets.QUALTRICS_DATACENTER }}
        run: |
          if [ -n "$QUALTRICS_TOKEN" ]; then
            python3 coverage_export.py --from-qualtrics --include-in-progress --allow-empty --out out --publish-dir docs
          else
            echo "No QUALTRICS_TOKEN yet: publishing the earlier waves only"
            python3 coverage_export.py --allow-empty --out out --publish-dir docs
          fi
      - name: Save the review queue as a private run artifact (repo members only; never published to the page)
        uses: actions/upload-artifact@v4
        with:
          name: review-queue
          path: |
            out/queue/unmatched.csv
            out/lists/pending_ambiguous.csv
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit the published dashboard (page, aggregates, school rosters; never the response file)
        run: |
          git config user.name "coverage-bot"
          git config user.email "coverage-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "Refresh coverage dashboard"
          # hourly and manual runs can overlap: rebase onto whatever landed meanwhile, then push (3 tries)
          for i in 1 2 3; do
            git fetch -q origin main && git rebase -q origin/main && git push && exit 0
            git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1
